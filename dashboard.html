<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netcup 流量监控面板</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            margin-bottom: 30px;
            animation: slideDown 0.5s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header h1 {
            font-size: 36px;
            color: #333;
            margin-bottom: 25px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .view-switcher {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .view-btn {
            padding: 12px 24px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .view-btn:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
        }

        .view-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 25px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.3);
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .stat-card h3 {
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .stat-card .value {
            font-size: 48px;
            font-weight: 800;
            line-height: 1;
        }

        .stat-card .subvalue {
            font-size: 18px;
            margin-top: 10px;
            opacity: 0.9;
        }

        .stat-card.warning {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            box-shadow: 0 5px 20px rgba(245, 87, 108, 0.3);
        }

        .stat-card.success {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            box-shadow: 0 5px 20px rgba(79, 172, 254, 0.3);
        }

        .stat-card.availability {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            box-shadow: 0 5px 20px rgba(56, 239, 125, 0.3);
        }

        .servers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(500px, 1fr));
            gap: 25px;
            animation: fadeIn 0.6s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .server-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .server-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.15);
            border-color: #667eea;
        }

        .server-card.throttled {
            border-color: #f5576c;
            background: linear-gradient(to bottom, #fff 0%, #fff5f7 100%);
        }

        .server-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 3px solid #f0f0f0;
        }

        .server-title {
            font-size: 20px;
            font-weight: 800;
            color: #333;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .server-title .name {
            font-size: 22px;
        }

        .server-title .ip {
            font-size: 14px;
            color: #6b7280;
            font-weight: 500;
        }

        .server-title .account {
            font-size: 12px;
            color: #667eea;
            font-weight: 600;
            background: #f0f4ff;
            padding: 4px 12px;
            border-radius: 8px;
            display: inline-block;
            width: fit-content;
        }

        .badge {
            padding: 8px 16px;
            border-radius: 25px;
            font-size: 12px;
            font-weight: 700;
            color: white;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .badge.throttled {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            box-shadow: 0 4px 15px rgba(245, 87, 108, 0.4);
        }

        .badge.normal {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            box-shadow: 0 4px 15px rgba(56, 239, 125, 0.4);
        }

        .throttle-status {
            background: linear-gradient(135deg, #fff5f7 0%, #ffe8ec 100%);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            border-left: 4px solid #f5576c;
        }

        .throttle-status.normal {
            background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
            border-left-color: #38ef7d;
        }

        .throttle-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 15px;
        }

        .throttle-stat-item {
            background: white;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
        }

        .throttle-stat-label {
            font-size: 11px;
            color: #6b7280;
            margin-bottom: 5px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .throttle-stat-value {
            font-size: 20px;
            font-weight: 800;
            color: #333;
        }

        .throttle-stat-value.large {
            font-size: 28px;
            color: #f5576c;
        }

        .throttle-stat-value.normal {
            color: #38ef7d;
        }

        .server-info {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .info-item {
            background: linear-gradient(135deg, #f9fafb 0%, #f0f4f8 100%);
            padding: 18px;
            border-radius: 12px;
            transition: all 0.3s ease;
        }

        .info-item:hover {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            transform: scale(1.05);
        }

        .info-item:hover .info-label {
            color: rgba(255, 255, 255, 0.9);
        }

        .info-item:hover .info-value {
            color: white;
        }

        .info-label {
            font-size: 11px;
            color: #6b7280;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .info-value {
            font-size: 20px;
            font-weight: 800;
            color: #111827;
        }

        .servers-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .server-list-item {
            background: white;
            border-radius: 15px;
            padding: 25px 30px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
            transition: all 0.3s ease;
            border-left: 5px solid #667eea;
            display: grid;
            grid-template-columns: 280px 1fr auto;
            gap: 20px;
            align-items: center;
        }

        .server-list-item:hover {
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
            transform: translateX(5px);
        }

        .server-list-item.throttled {
            border-left-color: #f5576c;
            background: linear-gradient(to right, #fff5f7 0%, #fff 100%);
        }

        .list-server-info {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .list-server-name {
            font-size: 18px;
            font-weight: 700;
            color: #333;
        }

        .list-server-ip {
            font-size: 14px;
            color: #6b7280;
            font-weight: 500;
        }

        .list-server-account {
            font-size: 11px;
            color: #667eea;
            font-weight: 600;
            background: #f0f4ff;
            padding: 3px 10px;
            border-radius: 6px;
            display: inline-block;
            width: fit-content;
        }

        .list-stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        .list-stat {
            text-align: center;
        }

        .list-stat-label {
            font-size: 11px;
            color: #6b7280;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .list-stat-value {
            font-size: 16px;
            font-weight: 700;
            color: #333;
        }

        .list-status-badge {
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            text-align: center;
            min-width: 100px;
        }

        .list-status-badge.throttled {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .list-status-badge.normal {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
        }

        .servers-compact {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 15px;
        }

        .server-compact-item {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            transition: all 0.3s ease;
            border-left: 4px solid #667eea;
        }

        .server-compact-item:hover {
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.12);
            transform: translateY(-3px);
        }

        .server-compact-item.throttled {
            border-left-color: #f5576c;
        }

        .compact-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .compact-title-wrapper {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .compact-title {
            font-size: 16px;
            font-weight: 700;
            color: #333;
        }

        .compact-account {
            font-size: 10px;
            color: #667eea;
            font-weight: 600;
            background: #f0f4ff;
            padding: 2px 8px;
            border-radius: 6px;
            display: inline-block;
            width: fit-content;
        }

        .compact-badge {
            padding: 5px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 700;
            color: white;
        }

        .compact-badge.throttled {
            background: #f5576c;
        }

        .compact-badge.normal {
            background: #38ef7d;
        }

        .compact-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            font-size: 13px;
        }

        .compact-stat {
            display: flex;
            justify-content: space-between;
            padding: 8px;
            background: #f9fafb;
            border-radius: 6px;
        }

        .compact-stat-label {
            color: #6b7280;
            font-weight: 600;
        }

        .compact-stat-value {
            font-weight: 700;
            color: #333;
        }

        .servers-table-container {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            overflow-x: auto;
        }

        .servers-table {
            width: 100%;
            border-collapse: collapse;
        }

        .servers-table thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .servers-table th {
            padding: 15px;
            text-align: left;
            font-weight: 700;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .servers-table td {
            padding: 15px;
            border-bottom: 1px solid #f0f0f0;
            font-size: 14px;
        }

        .servers-table tbody tr {
            transition: all 0.3s ease;
        }

        .servers-table tbody tr:hover {
            background: #f9fafb;
        }

        .servers-table tbody tr.throttled {
            background: #fff5f7;
        }

        .table-status {
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
            color: white;
            display: inline-block;
        }

        .table-status.throttled {
            background: #f5576c;
        }

        .table-status.normal {
            background: #38ef7d;
        }

        .table-account-badge {
            font-size: 11px;
            color: #667eea;
            font-weight: 600;
            background: #f0f4ff;
            padding: 3px 8px;
            border-radius: 6px;
            display: inline-block;
        }

        /* 报表视图专用样式 */
        .analytics-container {
            display: flex;
            flex-direction: column;
            gap: 25px;
            animation: fadeIn 0.4s ease;
        }

        .report-card {
            background: white;
            border-radius: 16px;
            padding: 25px 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        .report-card h2 {
            font-size: 20px;
            color: #2d3748;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 2px solid #edf2f7;
            padding-bottom: 12px;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        .metric-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 16px 20px;
            transition: all 0.2s ease;
        }

        .metric-box:hover {
            border-color: #cbd5e1;
            transform: translateY(-2px);
        }

        .metric-box .label {
            font-size: 13px;
            color: #64748b;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .metric-box .val {
            font-size: 26px;
            font-weight: 800;
            color: #1e293b;
            line-height: 1.2;
        }

        .metric-box .sub {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 6px;
        }

        .fluctuation-tag {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            margin-left: 8px;
        }
        .fluctuation-tag.up { background: #fee2e2; color: #ef4444; }
        .fluctuation-tag.down { background: #dcfce7; color: #16a34a; }
        .fluctuation-tag.flat { background: #f1f5f9; color: #64748b; }

        /* 每日波动走势柱状图 */
        .chart-wrapper {
            overflow-x: auto;
            padding: 20px 10px 10px;
        }
        .bar-chart {
            display: flex;
            align-items: flex-end;
            gap: 16px;
            height: 220px;
            min-width: 600px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 10px;
        }
        .chart-bar-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100%;
            justify-content: flex-end;
            position: relative;
        }
        .bar-stack {
            width: 32px;
            display: flex;
            flex-direction: column-reverse;
            background: #f1f5f9;
            border-radius: 6px 6px 0 0;
            overflow: hidden;
            transition: height 0.4s ease;
            cursor: pointer;
        }
        .bar-stack:hover {
            filter: brightness(1.1);
        }
        .bar-segment-tx {
            background: linear-gradient(180deg, #667eea 0%, #764ba2 100%);
            width: 100%;
        }
        .bar-segment-rx {
            background: #38ef7d;
            width: 100%;
        }
        .bar-label {
            font-size: 11px;
            color: #64748b;
            margin-top: 8px;
            white-space: nowrap;
            text-align: center;
        }
        .bar-val-tip {
            font-size: 11px;
            font-weight: 700;
            color: #475569;
            margin-bottom: 4px;
        }

        /* 限速时间线 */
        .timeline-container {
            max-height: 400px;
            overflow-y: auto;
            padding-right: 10px;
        }
        .timeline-item {
            display: flex;
            align-items: flex-start;
            gap: 15px;
            padding: 12px 0;
            border-bottom: 1px dashed #e2e8f0;
        }
        .timeline-badge {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
        }
        .timeline-badge.throttled {
            background: #fee2e2;
            color: #ef4444;
        }
        .timeline-badge.unthrottled {
            background: #dcfce7;
            color: #16a34a;
        }
        .timeline-content {
            flex: 1;
        }
        .timeline-title {
            font-size: 14px;
            font-weight: 700;
            color: #1e293b;
        }
        .timeline-time {
            font-size: 12px;
            color: #64748b;
            margin-top: 3px;
        }
        .timeline-duration {
            font-size: 12px;
            color: #0284c7;
            font-weight: 600;
            margin-top: 2px;
        }

        .loading {
            text-align: center;
            padding: 60px;
            color: white;
            font-size: 20px;
            font-weight: 600;
            animation: pulse 1.5s ease infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }

        .last-update {
            text-align: center;
            color: white;
            margin-top: 40px;
            font-size: 16px;
            font-weight: 500;
            opacity: 0.9;
        }

        .refresh-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .refresh-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.5);
        }

        .refresh-btn:active {
            transform: translateY(0);
        }

        @media (max-width: 768px) {
            .servers-grid {
                grid-template-columns: 1fr;
            }

            .servers-compact {
                grid-template-columns: 1fr;
            }

            .server-list-item {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .list-stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 28px;
            }

            .view-switcher {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🖥️ Netcup 流量监控面板</h1>
            
            <div class="view-switcher">
                <button class="view-btn active" onclick="switchView('card')">🎴 卡片视图</button>
                <button class="view-btn" onclick="switchView('list')">📋 列表视图</button>
                <button class="view-btn" onclick="switchView('compact')">📦 紧凑视图</button>
                <button class="view-btn" onclick="switchView('table')">📊 表格视图</button>
                <button class="view-btn" onclick="switchView('analytics')">📈 运行分析报表</button>
            </div>
            
            <div id="sortSwitcher" class="view-switcher" style="margin-top: 15px;">
                <button class="view-btn" onclick="sortServers('default')">🔄 默认排序</button>
                <button class="view-btn" onclick="sortServers('today_traffic')">📅 今日流量</button>
                <button class="view-btn" onclick="sortServers('traffic')">📊 累计流量</button>
                <button class="view-btn" onclick="sortServers('upload')">⬆️ 累计上传</button>
                <button class="view-btn" onclick="sortServers('download')">⬇️ 累计下载</button>
                <button class="view-btn" onclick="sortServers('throttle')">🔴 限速次数</button>
                <button class="view-btn" onclick="sortServers('status')">⚠️ 限速状态</button>
            </div>

            <div id="stats" class="stats"></div>
        </div>
        <div id="servers"></div>
        <div id="loading" class="loading">⏳ 正在加载数据...</div>
        <div class="last-update" id="lastUpdate"></div>
    </div>
    
    <button class="refresh-btn" onclick="fetchData()">🔄 刷新数据</button>

    <script>
        const API_URL = '/api/status';
        const ANALYTICS_API_URL = '/api/analytics';
        const REFRESH_INTERVAL = 10000;
        let currentData = null;
        let analyticsData = null;
        let currentView = 'card';
        let currentSort = 'default';
        let sortedServers = [];

        async function fetchData() {
            try {
                const response = await fetch(API_URL);
                const result = await response.json();
                if (result.success) {
                    currentData = result.data;
                    if (currentView !== 'analytics') {
                        updateView();
                    } else {
                        fetchAnalyticsData();
                    }
                }
            } catch (error) {
                console.error('加载数据失败:', error);
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        async function fetchAnalyticsData() {
            try {
                const response = await fetch(ANALYTICS_API_URL);
                const result = await response.json();
                if (result.success) {
                    analyticsData = result;
                    renderAnalyticsView();
                }
            } catch (error) {
                console.error('加载分析报表失败:', error);
            }
        }

        function formatTraffic(tib) {
            if (tib === undefined || tib === null) return '0 GiB';
            if (tib >= 1) {
                return `${Number(tib).toFixed(3)} TiB`;
            } else {
                return `${(Number(tib) * 1024).toFixed(2)} GiB`;
            }
        }

        function switchView(view) {
            currentView = view;
            
            document.querySelectorAll('.view-switcher')[0].querySelectorAll('.view-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            const sortBar = document.getElementById('sortSwitcher');
            if (view === 'analytics') {
                if (sortBar) sortBar.style.display = 'none';
                fetchAnalyticsData();
            } else {
                if (sortBar) sortBar.style.display = 'flex';
                updateView();
            }
        }
        
        function sortServers(sortType) {
            currentSort = sortType;
            
            document.querySelectorAll('.view-switcher')[1].querySelectorAll('.view-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            if (!currentData || !currentData.servers) return;
            
            sortedServers = [...currentData.servers];
            
            switch(sortType) {
                case 'today_traffic':
                    sortedServers.sort((a, b) => (b.today_traffic_tib || 0) - (a.today_traffic_tib || 0));
                    break;
                case 'traffic':
                    sortedServers.sort((a, b) => b.traffic_tib - a.traffic_tib);
                    break;
                case 'upload':
                    sortedServers.sort((a, b) => b.tx_tib - a.tx_tib);
                    break;
                case 'download':
                    sortedServers.sort((a, b) => b.rx_tib - a.rx_tib);
                    break;
                case 'throttle':
                    sortedServers.sort((a, b) => b.throttle_count - a.throttle_count);
                    break;
                case 'status':
                    sortedServers.sort((a, b) => {
                        if (a.trafficThrottled && !b.trafficThrottled) return -1;
                        if (!a.trafficThrottled && b.trafficThrottled) return 1;
                        return 0;
                    });
                    break;
                default:
                    break;
            }
            
            updateView();
        }

        function updateView() {
            if (!currentData) return;
            
            if (sortedServers.length === 0) {
                sortedServers = [...currentData.servers];
            }

            const totalServers = currentData.total_servers;
            const normalCount = currentData.normal_count;
            const availabilityRate = totalServers > 0 
                ? ((normalCount / totalServers) * 100).toFixed(2) 
                : 100;

            const totalTodayTx = currentData.servers ? currentData.servers.reduce((sum, s) => sum + (s.today_tx_tib || 0), 0) : 0;
            const totalTodayRx = currentData.servers ? currentData.servers.reduce((sum, s) => sum + (s.today_rx_tib || 0), 0) : 0;
            const totalTodayTraffic = totalTodayTx + totalTodayRx;

            document.getElementById('stats').innerHTML = `
                <div class="stat-card">
                    <h3>📊 总服务器</h3>
                    <div class="value">${totalServers}</div>
                </div>
                <div class="stat-card availability">
                    <h3>✅ 整体可用率</h3>
                    <div class="value">${availabilityRate}%</div>
                    <div class="subvalue">${normalCount} / ${totalServers} 在线</div>
                </div>
                <div class="stat-card" style="background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);">
                    <h3>📅 今日总流量</h3>
                    <div class="value">${formatTraffic(totalTodayTraffic)}</div>
                    <div class="subvalue">↑ ${formatTraffic(totalTodayTx)} / ↓ ${formatTraffic(totalTodayRx)}</div>
                </div>
                <div class="stat-card warning">
                    <h3>🔴 限速中</h3>
                    <div class="value">${currentData.throttled_count}</div>
                </div>
                <div class="stat-card success">
                    <h3>🟢 正常运行</h3>
                    <div class="value">${normalCount}</div>
                </div>
            `;

            const serversContainer = document.getElementById('servers');
            
            if (currentView === 'card') {
                serversContainer.className = 'servers-grid';
                serversContainer.innerHTML = renderCardView();
            } else if (currentView === 'list') {
                serversContainer.className = 'servers-list';
                serversContainer.innerHTML = renderListView();
            } else if (currentView === 'compact') {
                serversContainer.className = 'servers-compact';
                serversContainer.innerHTML = renderCompactView();
            } else if (currentView === 'table') {
                serversContainer.className = '';
                serversContainer.innerHTML = renderTableView();
            } else if (currentView === 'analytics') {
                renderAnalyticsView();
            }

            document.getElementById('lastUpdate').textContent = `📅 最后更新: ${currentData.last_update}`;
        }

        function renderAnalyticsView() {
            if (!analyticsData) return;
            const serversContainer = document.getElementById('servers');
            serversContainer.className = 'analytics-container';

            const d = analyticsData;
            const today = d.today || {};
            const yesterday = d.yesterday || {};
            const thisWeek = d.this_week || {};
            const thisMonth = d.this_month || {};
            const thrSum = d.throttle_summary || {};
            const recentDays = d.recent_days || [];
            const months = d.monthly_history || [];
            const timeline = d.throttle_timeline || [];

            // 波动显示
            let diffTag = '<span class="fluctuation-tag flat">持平 ➖</span>';
            if (today.diff_vs_yesterday > 0) {
                diffTag = `<span class="fluctuation-tag up">+${today.diff_vs_yesterday.toFixed(3)} TiB (+${today.pct_vs_yesterday}%) 📈</span>`;
            } else if (today.diff_vs_yesterday < 0) {
                diffTag = `<span class="fluctuation-tag down">${today.diff_vs_yesterday.toFixed(3)} TiB (${today.pct_vs_yesterday}%) 📉</span>`;
            }

            // 柱状图最高基准
            const maxTraffic = Math.max(...recentDays.map(r => r.total_tib || 0), 0.1);

            let chartBarsHtml = recentDays.map(item => {
                const heightPct = Math.min(100, Math.max(5, (item.total_tib / maxTraffic) * 100));
                const txPct = item.total_tib > 0 ? (item.tx_tib / item.total_tib) * 100 : 0;
                const rxPct = item.total_tib > 0 ? (item.rx_tib / item.total_tib) * 100 : 0;
                const isToday = item.date === today.date;

                return `
                    <div class="chart-bar-group">
                        <div class="bar-val-tip">${item.total_tib.toFixed(2)}T</div>
                        <div class="bar-stack" style="height: ${heightPct}%;" title="${item.date} (${item.weekday})\n总计: ${item.total_tib} TiB\n上传: ${item.tx_tib} TiB\n下载: ${item.rx_tib} TiB">
                            <div class="bar-segment-tx" style="height: ${txPct}%;"></div>
                            <div class="bar-segment-rx" style="height: ${rxPct}%;"></div>
                        </div>
                        <div class="bar-label" style="${isToday ? 'color: #667eea; font-weight: 700;' : ''}">
                            ${item.date.slice(5)}<br>${item.weekday}
                        </div>
                    </div>
                `;
            }).join('');

            // 月度表格
            let monthlyRowsHtml = months.map(m => `
                <tr style="${m.is_current ? 'background: #f8fafc; font-weight: 700;' : ''}">
                    <td style="padding: 12px 16px; border-bottom: 1px solid #edf2f7;">
                        <b>${m.month}</b> ${m.is_current ? '<span style="color:#667eea; font-size:12px;">(本月至今)</span>' : ''}
                    </td>
                    <td style="padding: 12px 16px; border-bottom: 1px solid #edf2f7; color: #667eea;">
                        ${formatTraffic(m.tx_tib)}
                    </td>
                    <td style="padding: 12px 16px; border-bottom: 1px solid #edf2f7; color: #16a34a;">
                        ${formatTraffic(m.rx_tib)}
                    </td>
                    <td style="padding: 12px 16px; border-bottom: 1px solid #edf2f7; font-weight: 800; color: #1e293b;">
                        ${formatTraffic(m.total_tib)}
                    </td>
                </tr>
            `).join('');

            // 限速时间线
            let timelineHtml = timeline.length === 0 ? '<div style="color: #64748b; padding: 20px 0;">✨ 暂无限速历史记录，服务器运行平稳！</div>' : timeline.map(ev => {
                const isThr = ev.event === 'throttled';
                return `
                    <div class="timeline-item">
                        <div class="timeline-badge ${isThr ? 'throttled' : 'unthrottled'}">
                            ${isThr ? '🛑' : '🟢'}
                        </div>
                        <div class="timeline-content">
                            <div class="timeline-title">
                                ${isThr ? '触发限速保护' : '限速解除'} — <b>${ev.server_name}</b> (<code>${ev.ip}</code>)
                            </div>
                            <div class="timeline-time">⏰ 发生时间: ${ev.datetime}</div>
                            ${ev.duration_str ? `<div class="timeline-duration">⏱️ 本次限速持续时长: <b>${ev.duration_str}</b></div>` : ''}
                        </div>
                    </div>
                `;
            }).join('');

            serversContainer.innerHTML = `
                <!-- 模块 1: 多周期统计卡片 -->
                <div class="report-card">
                    <h2>📊 官方多周期流量对比与每日波动</h2>
                    <div class="metrics-grid">
                        <div class="metric-box">
                            <div class="label">📅 今日跑量 (日波动)</div>
                            <div class="val">${formatTraffic(today.total_tib)} ${diffTag}</div>
                            <div class="sub">↑ 上传: ${formatTraffic(today.tx_tib)} | ↓ 下载: ${formatTraffic(today.rx_tib)}</div>
                        </div>
                        <div class="metric-box">
                            <div class="label">📆 昨日全天跑量</div>
                            <div class="val">${formatTraffic(yesterday.total_tib)}</div>
                            <div class="sub">↑ 上传: ${formatTraffic(yesterday.tx_tib)} | ↓ 下载: ${formatTraffic(yesterday.rx_tib)}</div>
                        </div>
                        <div class="metric-box">
                            <div class="label">🗓️ 本周累计流量 (周一至今)</div>
                            <div class="val">${formatTraffic(thisWeek.total_tib)}</div>
                            <div class="sub">↑ 上传: ${formatTraffic(thisWeek.tx_tib)} | ↓ 下载: ${formatTraffic(thisWeek.rx_tib)}</div>
                        </div>
                        <div class="metric-box">
                            <div class="label">💾 本月累计流量 (${thisMonth.month})</div>
                            <div class="val" style="color: #667eea;">${formatTraffic(thisMonth.total_tib)}</div>
                            <div class="sub">↑ 上传: ${formatTraffic(thisMonth.tx_tib)} | ↓ 下载: ${formatTraffic(thisMonth.rx_tib)}</div>
                        </div>
                    </div>
                </div>

                <!-- 模块 2: 14 天流量走势与每日波动图表 -->
                <div class="report-card">
                    <h2>📈 最近 14 天每日流量波动走势 (紫色:上传 / 绿色:下载)</h2>
                    <div class="chart-wrapper">
                        <div class="bar-chart">
                            ${chartBarsHtml}
                        </div>
                    </div>
                    <div style="font-size: 12px; color: #94a3b8; margin-top: 10px; text-align: right;">
                        💡 柱条高度为每日总跑量占比，紫柱为上传量，绿柱为下载量
                    </div>
                </div>

                <!-- 模块 3: 每月流量永久历史记录 (不怕机房重置) -->
                <div class="report-card">
                    <h2>🗓️ 每月流量永久账单 (自动归档，机房重置后依然永久保存)</h2>
                    <div style="overflow-x: auto;">
                        <table style="width: 100%; border-collapse: collapse; text-align: left; font-size: 14px;">
                            <thead>
                                <tr style="background: #f1f5f9; color: #475569; font-weight: 700;">
                                    <th style="padding: 12px 16px;">月份周期</th>
                                    <th style="padding: 12px 16px;">月度总上传</th>
                                    <th style="padding: 12px 16px;">月度总下载</th>
                                    <th style="padding: 12px 16px;">全月总流量</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${monthlyRowsHtml}
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- 模块 4: 被限速的时间与事件轴 -->
                <div class="report-card">
                    <h2>🛑 详细被限速时间与事件记录</h2>
                    <div class="timeline-container">
                        ${timelineHtml}
                    </div>
                </div>
            `;
        }

        function renderCardView() {
            return sortedServers.map(s => {
                const isThrottled = s.trafficThrottled;
                
                return `
                <div class="server-card ${isThrottled ? 'throttled' : ''}">
                    <div class="server-header">
                        <div class="server-title">
                            <div class="name">${s.server_name}</div>
                            <div class="ip">${s.ipv4IP}</div>
                            <div class="account">📋 ${s.account_id}</div>
                        </div>
                        <span class="badge ${isThrottled ? 'throttled' : 'normal'}">
                            ${isThrottled ? '🔴 限速中' : '🟢 正常'}
                        </span>
                    </div>
                    
                    <div class="throttle-status ${isThrottled ? '' : 'normal'}">
                        <div class="throttle-stats">
                            <div class="throttle-stat-item">
                                <div class="throttle-stat-label">${isThrottled ? '当前已限速' : '累计限速时长'}</div>
                                <div class="throttle-stat-value ${isThrottled ? 'large' : ''}">
                                    ${isThrottled ? s.current_throttle_duration : s.total_throttled_time}
                                </div>
                            </div>
                            <div class="throttle-stat-item">
                                <div class="throttle-stat-label">限速次数</div>
                                <div class="throttle-stat-value">${s.throttle_count} 次</div>
                            </div>
                            ${s.last_throttle_time ? `
                            <div class="throttle-stat-item">
                                <div class="throttle-stat-label">上次限速</div>
                                <div class="throttle-stat-value" style="font-size: 12px;">${s.last_throttle_time}</div>
                            </div>
                            ` : ''}
                            ${s.last_unthrottle_time ? `
                            <div class="throttle-stat-item">
                                <div class="throttle-stat-label">解除限速</div>
                                <div class="throttle-stat-value" style="font-size: 12px;">${s.last_unthrottle_time}</div>
                            </div>
                            ` : ''}
                        </div>
                    </div>
                    
                    <div class="server-info">
                        <div class="info-item">
                            <div class="info-label">📅 今日流量</div>
                            <div class="info-value" style="color: #667eea; font-weight: 700;">${formatTraffic(s.today_traffic_tib || 0)}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">⬆️ 今日上传</div>
                            <div class="info-value">${formatTraffic(s.today_tx_tib || 0)}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">⬇️ 今日下载</div>
                            <div class="info-value">${formatTraffic(s.today_rx_tib || 0)}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">💾 累计总流量</div>
                            <div class="info-value">${formatTraffic(s.traffic_tib)}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">⬆️ 累计上传</div>
                            <div class="info-value">${formatTraffic(s.tx_tib)}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">⬇️ 累计下载</div>
                            <div class="info-value">${formatTraffic(s.rx_tib)}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">💽 剩余磁盘</div>
                            <div class="info-value" style="${(s.free_disk_gib !== undefined && s.free_disk_gib !== null && s.free_disk_gib <= 5) ? 'color: #e53e3e; font-weight: 700;' : ''}">${s.free_disk_gib !== undefined && s.free_disk_gib !== null ? s.free_disk_gib.toFixed(2) + ' GiB' : '检测中'}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">🔄 状态</div>
                            <div class="info-value">${s.status}</div>
                        </div>
                    </div>
                </div>
            `}).join('');
        }

        function renderListView() {
            return sortedServers.map(s => {
                const isThrottled = s.trafficThrottled;
                
                return `
                <div class="server-list-item ${isThrottled ? 'throttled' : ''}">
                    <div class="list-server-info">
                        <div class="list-server-name">${s.server_name}</div>
                        <div class="list-server-ip">📍 ${s.ipv4IP}</div>
                        <div class="list-server-account">📋 ${s.account_id}</div>
                    </div>
                    
                    <div class="list-stats-grid">
                        <div class="list-stat">
                            <div class="list-stat-label">总流量</div>
                            <div class="list-stat-value">${formatTraffic(s.traffic_tib)}</div>
                        </div>
                        <div class="list-stat">
                            <div class="list-stat-label">限速次数</div>
                            <div class="list-stat-value">${s.throttle_count} 次</div>
                        </div>
                        <div class="list-stat">
                            <div class="list-stat-label">${isThrottled ? '当前限速' : '累计限速'}</div>
                            <div class="list-stat-value">${isThrottled ? s.current_throttle_duration : s.total_throttled_time}</div>
                        </div>
                        <div class="list-stat">
                            <div class="list-stat-label">状态</div>
                            <div class="list-stat-value">${s.status}</div>
                        </div>
                    </div>
                    
                    <div class="list-status-badge ${isThrottled ? 'throttled' : 'normal'}">
                        ${isThrottled ? '🔴 限速中' : '🟢 正常'}
                    </div>
                </div>
            `}).join('');
        }

        function renderCompactView() {
            return sortedServers.map(s => {
                const isThrottled = s.trafficThrottled;
                
                return `
                <div class="server-compact-item ${isThrottled ? 'throttled' : ''}">
                    <div class="compact-header">
                        <div class="compact-title-wrapper">
                            <div class="compact-title">${s.server_name}</div>
                            <div class="compact-account">📋 ${s.account_id}</div>
                        </div>
                        <span class="compact-badge ${isThrottled ? 'throttled' : 'normal'}">
                            ${isThrottled ? '限速' : '正常'}
                        </span>
                    </div>
                    
                    <div class="compact-stats">
                        <div class="compact-stat">
                            <span class="compact-stat-label">IP</span>
                            <span class="compact-stat-value">${s.ipv4IP}</span>
                        </div>
                        <div class="compact-stat">
                            <span class="compact-stat-label">总流量</span>
                            <span class="compact-stat-value">${formatTraffic(s.traffic_tib)}</span>
                        </div>
                        <div class="compact-stat">
                            <span class="compact-stat-label">限速次数</span>
                            <span class="compact-stat-value">${s.throttle_count} 次</span>
                        </div>
                        <div class="compact-stat">
                            <span class="compact-stat-label">${isThrottled ? '当前限速' : '累计限速'}</span>
                            <span class="compact-stat-value">${isThrottled ? s.current_throttle_duration : s.total_throttled_time}</span>
                        </div>
                    </div>
                </div>
            `}).join('');
        }

        function renderTableView() {
            const rows = sortedServers.map(s => {
                const isThrottled = s.trafficThrottled;
                
                return `
                <tr class="${isThrottled ? 'throttled' : ''}">
                    <td>
                        <strong>${s.server_name}</strong><br>
                        <small style="color: #6b7280;">${s.ipv4IP}</small><br>
                        <span class="table-account-badge">📋 ${s.account_id}</span>
                    </td>
                    <td><span class="table-status ${isThrottled ? 'throttled' : 'normal'}">${isThrottled ? '🔴 限速中' : '🟢 正常'}</span></td>
                    <td>${formatTraffic(s.traffic_tib)}</td>
                    <td>${formatTraffic(s.tx_tib)}</td>
                    <td>${formatTraffic(s.rx_tib)}</td>
                    <td>${s.throttle_count} 次</td>
                    <td>${isThrottled ? s.current_throttle_duration : s.total_throttled_time}</td>
                    <td>${s.last_throttle_time || '-'}</td>
                    <td>${s.status}</td>
                </tr>
            `}).join('');
            
            return `
                <div class="servers-table-container">
                    <table class="servers-table">
                        <thead>
                            <tr>
                                <th>服务器</th>
                                <th>状态</th>
                                <th>总流量</th>
                                <th>上传</th>
                                <th>下载</th>
                                <th>限速次数</th>
                                <th>限速时长</th>
                                <th>上次限速</th>
                                <th>运行状态</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${rows}
                        </tbody>
                    </table>
                </div>
            `;
        }

        fetchData();
        setInterval(fetchData, REFRESH_INTERVAL);
    </script>
</body>
</html>
